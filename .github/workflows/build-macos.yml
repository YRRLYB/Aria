name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - "test/macos-*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Aria macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # These workflows produce unsigned DMGs. If you configure an Apple
      # Developer certificate, remove this line and pass CSC_LINK /
      # CSC_KEY_PASSWORD plus the APPLE_* notarization secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Each matrix runner packages only its own CPU, so skip cross-compiling
      # the other slice of the Now Playing addon.
      ARIA_MAC_SINGLE_ARCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Prepare mpv
        run: npm run ensure:mpv

      - name: Build native addon
        run: npm run build:native

      - name: Build updater
        run: npm run build:updater

      - name: Build web and server
        run: npm run build:web && npm run build:server

      - name: Package DMG
        run: npx electron-builder --config electron-builder.config.cjs --publish never --mac dmg --${{ matrix.arch }}

      - name: Verify architecture
        run: |
          APP="$(find release -maxdepth 2 -name Aria.app -type d | head -n 1)"
          echo "Verifying $APP"
          lipo -archs "$APP/Contents/Resources/app.asar.unpacked/vendor/mpv/mpv"
          lipo -archs "$APP/Contents/Resources/app.asar.unpacked/electron/native/aria-nowplaying/aria_nowplaying.node"
          lipo -archs "$APP/Contents/Resources/app.asar.unpacked/dist-server/node_modules/@img/sharp-darwin-${{ matrix.arch }}/lib/sharp-darwin-${{ matrix.arch }}.node"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aria-macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 6); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Aria $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" release/*.dmg --clobber
