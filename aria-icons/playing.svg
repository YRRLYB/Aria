<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
<style>
@keyframes aria-eq-a{0%,100%{transform:scaleY(.38)}35%{transform:scaleY(.95)}65%{transform:scaleY(.52)}85%{transform:scaleY(.86)}}
@keyframes aria-eq-b{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.34)}72%{transform:scaleY(.84)}}
@keyframes aria-eq-c{0%,100%{transform:scaleY(.44)}38%{transform:scaleY(1)}70%{transform:scaleY(.36)}}
.aria-eq{transform-box:fill-box;transform-origin:50% 50%}
.aria-eq-1{animation:aria-eq-a .92s ease-in-out infinite}
.aria-eq-2{animation:aria-eq-b .78s ease-in-out -.22s infinite}
.aria-eq-3{animation:aria-eq-c .86s ease-in-out -.48s infinite}
</style>
<rect class="aria-eq aria-eq-1" x="4.5" y="4.5" width="3" height="15" rx="1.5"/>
<rect class="aria-eq aria-eq-2" x="10.5" y="4.5" width="3" height="15" rx="1.5"/>
<rect class="aria-eq aria-eq-3" x="16.5" y="4.5" width="3" height="15" rx="1.5"/>
</svg>
